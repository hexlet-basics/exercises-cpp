---
name: Ссылки и указатели
description: |
  Ссылки и указатели — одна из главных тем в C++, поскольку с ними связано множество операций - это и передача аргумента по ссылке и динамическое выделение памяти. В этом модуле мы узнаем, как их создавать и какие базовые операции существуют для ссылок и указателей.
